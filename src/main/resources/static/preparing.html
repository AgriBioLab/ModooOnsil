<!doctype html>
<html lang="ko">

  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/krds/css/component/output.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/preparing.css" />

    <script src="/js/preparing.js" defer></script>
  </head>

  <body>
    <main class="preparing-wrap">
      <!-- 상단 로고 -->
      <a class="preparing-home-link" href="/index.html" aria-label="모두의 온실 홈으로 이동">
        <span class="brand-lockup">
          <img class="brand-mark" src="/img/logo-mark.svg" alt="" />
          <span class="brand-wordmark">모두의 온실</span>
        </span>

      <!-- 안내 카드 -->
      <section class="preparing-card" aria-labelledby="preparingHeading">
        <p class="preparing-code" id="preparingCode">서비스 준비중</p>
        <h1 id="preparingHeading" class="preparing-title">현재 페이지는 준비중입니다.</h1>
        <p class="preparing-desc" id="preparingDesc">
          보다 안정적인 온실 관리 서비스를 제공하기 위해 준비하고 있습니다.<br />
          잠시 후 다시 이용해 주세요.
        </p>

        <div class="preparing-actions">
          <a class="krds-btn medium primary" href="/index.html">메인으로 이동</a>
          <button
            type="button"
            id="preparingBackBtn"
            class="krds-btn medium secondary">
            이전 페이지로 이동
          </button>
        </div>
      </section>

      <!-- 저작권 안내 -->
      <p class="preparing-copy">&copy; 2026 모두의온실. All rights reserved.</p>
    </main>
