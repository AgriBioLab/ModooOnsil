<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모두의온실 | 로그인</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/krds/css/component/output.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/sampleData.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="login" class="signed-out-page">
<main id="signedOutOverlay" class="signed-out">
  <section class="signed-out-card" aria-labelledby="loginTitle">
    <a class="login-brand" href="index.html" aria-label="모두의 온실"><svg class="auth-brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 76" aria-hidden="true"><g fill="#13261B" font-family="'GmarketSansBold','Pretendard GOV','Malgun Gothic',sans-serif" font-weight="700" text-anchor="end"><text x="112" y="34" font-size="27" letter-spacing="-1.2">모두의</text><text x="112" y="64" font-size="27" letter-spacing="-1.2">온실</text></g><g transform="translate(124,10)"><path d="M21 0C9.4 0 0 9.4 0 21v35h38V21C38 9.4 28.6 0 21 0z" fill="#176B3A"/><path d="M52 10c-10.5 0-19 8.5-19 19v27h38V29c0-10.5-8.5-19-19-19z" fill="#176B3A" fill-opacity="0.45"/><path d="M33 29v27h6V25c-3.5 1-6 2.3-6 4z" fill="#FFFFFF"/></g></svg></a>
    <h1 id="loginTitle">로그인</h1>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label class="form-label" for="loginUsername">아이디</label>
        <input id="loginUsername" name="username" class="krds-input medium" type="text" maxlength="20" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">비밀번호</label>
        <div class="auth-input-row">
          <input id="loginPassword" name="password" class="krds-input medium" type="password" maxlength="20" autocomplete="current-password" required>
          <button type="button" class="krds-btn medium secondary" id="loginPasswordToggle" aria-controls="loginPassword">비밀번호 보기</button>
        </div>
      </div>
      <p id="loginError" class="auth-feedback" role="alert" data-state="error" tabindex="-1"></p>
      <button type="submit" class="krds-btn medium primary">로그인</button>
      <p id="loginHelp">기본 아이디 <strong>seedmum02</strong> / 비밀번호 <strong>modoodemo01</strong></p>
      <div class="auth-links">
        <span>처음이신가요?</span>
        <a href="signup.html">회원가입</a>
      </div>
    </form>
  </section>
</main>
<div id="footerSlot"></div>
<div class="notice-toast hidden" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
