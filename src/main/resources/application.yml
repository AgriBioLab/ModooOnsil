server:
  port: ${SERVER_PORT}
spring:
  application:
    name: ModooOnsil
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb?characterEncoding=UTF-8
    username: ${DB_ID}
    password: ${DB_PW}
  #  datasource: #DBCP.java
  #    driver-class-name: oracle.jdbc.OracleDriver
  #    url: jdbc:oracle:thin:@127.0.0.1:1521/xe
  #    username: hr
  #    password: hr
  jpa:
    open-in-view: false
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true
  config:
    import: optional:file:.env[.properties]
