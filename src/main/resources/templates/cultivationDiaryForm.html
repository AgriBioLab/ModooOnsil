<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" th:href="@{/}" />
    <title th:text="${diaryView == 'edit'} ? '모두의온실 | 재배일지작업 수정' : '모두의온실 | 재배일지작업 등록'">모두의온실 | 재배일지작업</title>

    <link rel="stylesheet" href="vendor/krds/css/component/output.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cultivationDiary.css?v=20261120-badges" />

    <script src="js/common.js" defer></script>
    <script src="js/date-picker.js" defer></script>
    <script src="js/cultivationDiary.js?v=20261126-mvc-split" defer></script>
  </head>

  <body th:attr="data-page=${diaryView},data-diary-view=${diaryView},data-diary-id=${diaryId}">
    <div class="app">
      <!-- 사이드바 -->
      <aside th:replace="~{sidebar :: sidebar}"></aside>

      <div class="workarea">
        <!-- 상단 헤더 -->
        <header th:replace="~{header :: header}"></header>

        <!-- 본문 -->
        <main>
          <nav class="crumb" aria-label="현재 위치">
            <span id="crumb" th:text="${diaryView == 'edit'} ? '재배일지작업 / 수정' : '재배일지작업 / 등록'">재배일지작업 / 등록</span>
          </nav>

          <div class="page-content" id="main" tabindex="-1">
            <!-- 상단 제목 -->
            <div class="pagehead">
              <div>
                <h1 th:text="${diaryView == 'edit'} ? '재배일지작업 수정' : '재배일지작업 등록'">재배일지작업 등록</h1>
                <p id="formLoadErrorMsg" class="hidden"></p>
              </div>
              <a class="backlink hidden" id="returnList" th:href="@{/cultivation-diaries}">← 재배일지작업 목록으로</a>
            </div>

            <!-- 등록 / 수정 폼 -->
            <form class="editor-shell" id="diaryForm" novalidate>
              <!-- 좌측 기본정보 패널 -->
              <section class="panel editor-summary" aria-label="재배일지작업 기본정보">
                <div class="summary-strip">
                  <div class="summary-fact">
                    <span>작기계획명</span>
                    <span class="summary-value" id="summaryCycle">—</span>
                  </div>
                  <div class="summary-fact">
                    <span>품목명 · 품종명</span>
                    <span class="summary-value" id="summaryCrop">—</span>
                  </div>
                  <div class="summary-fact">
                    <span>온실명</span>
                    <span class="summary-value" id="summaryHouse">—</span>
                  </div>
                  <div class="summary-fact">
                    <span>실제 작업일</span>
                    <span class="summary-value" id="summaryDate">—</span>
                  </div>
                  <div class="summary-fact">
                    <span>실제 생육단계</span>
                    <span class="summary-value" id="summaryStage">—</span>
                  </div>
                </div>

                <div class="summary-detail" id="baseFields">
                  <div class="field">
                    <label for="cycleId">작기계획명 <span class="required">*</span></label>
                    <select class="ctrl" id="cycleId" th:disabled="${diaryView == 'edit'}"></select>
                  </div>

                  <div class="field">
                    <label for="workDateTrigger">실제 작업일 <span class="required">*</span></label>
                    <div id="workDateControl"></div>
                  </div>

                  <div class="stage-group" aria-label="실제 생육단계">
                    <div class="field">
                      <label for="stageId">해당 날짜의 실제 생육단계 <span class="required">*</span></label>
                      <select class="ctrl" id="stageId"></select>
                    </div>
                  </div>

                  <div class="reason-box hidden" id="confirmedReasonBox">
                    <span class="reason-box-title">확정된 변경 사유</span>
                    <p class="reason-text" id="confirmedReasonText"></p>
                  </div>

                  <div class="reason-box hidden" id="reasonBox">
                    <label for="stageChangeReason" class="label">생육단계 변경 사유 *</label>
                    <textarea class="ctrl textarea" id="stageChangeReason" rows="4" maxlength="500" placeholder="실제 생육단계를 변경한 근거와 관찰 내용을 입력하세요"></textarea>
                  </div>

                  <div id="duplicateNotice" class="errorbox hidden" role="status">해당 날짜에 이미 재배일지가 등록되어 있습니다.</div>
                  <div id="formError" class="errorbox hidden" role="alert"></div>
                </div>
              </section>

              <!-- 우측 작업내용 패널 -->
              <section class="panel editor-workpanel">
                <div class="panel-head">
                  <p class="panel-title">작업내용</p>
                  <span class="counter" id="taskTotal">0건</span>
                </div>

                <div class="task-body">
                  <div class="task-tools">
                    <span class="muted small">작업시간 오름차순</span>
                  </div>

                  <div class="task-scroll" id="tasksScroll">
                    <div class="task-list-header">
                      <span>작업명</span>
                      <span>작업시간</span>
                      <span>작업유형</span>
                      <span>작업상태</span>
                      <span></span>
                    </div>
                    <div id="taskList"></div>
                  </div>

                  <button class="add-btn" id="addTask" type="button">+ 작업내용 추가</button>

                  <div class="form-actions">
                    <a class="btn" id="cancel" th:href="${diaryView == 'edit'} ? @{/cultivation-diaries/{id}(id=${diaryId})} : @{/cultivation-diaries}">취소</a>
                    <button class="btn main" type="submit" th:text="${diaryView == 'edit'} ? '수정 저장' : '등록'">등록</button>
                  </div>
                </div>
              </section>
            </form>
          </div>
        </main>

        <!-- 푸터 -->
        <footer th:replace="~{footer :: footer}"></footer>
      </div>
    </div>

    <div class="notice-toast hidden" id="toast" role="status" aria-live="polite"></div>

    <!-- 작업 카드 동적 추가용 템플릿 -->
    <template id="diaryTaskCardTemplate">
      <article class="task-card" data-taskid="">
        <div class="task-summary">
          <span class="task-title title-text">새 작업</span>
          <span class="summary-time">09:00</span>
          <span class="summary-type">관수</span>
          <span class="krds-badge bg-light-gray summary-status">미완료</span>
          <button class="trash" type="button" data-remove="" aria-label="새 작업 삭제" title="삭제">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M10 4h4M7 7l1 13h8l1-13M10 11v6M14 11v6" />
            </svg>
          </button>
        </div>

        <div class="task-detail">
          <div class="field wide">
            <label>작업명 *</label>
            <input class="ctrl compact-input t-name" maxlength="100" placeholder="작업명" />
          </div>
          <div class="field">
            <label>작업유형 *</label>
            <select class="ctrl t-type">
              <option value="관수">관수</option>
              <option value="방제">방제</option>
              <option value="환경 조절">환경 조절</option>
              <option value="생육 관리">생육 관리</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="field">
            <label>작업시간 *</label>
            <input class="ctrl t-time" type="time" />
          </div>
          <div class="field">
            <label>작업상태 *</label>
            <select class="ctrl t-status">
              <option value="완료">완료</option>
              <option value="미완료">미완료</option>
            </select>
          </div>
          <div class="field wide">
            <label>작업내용</label>
            <textarea class="ctrl t-content" rows="2" placeholder="작업 내용을 입력하세요"></textarea>
          </div>
        </div>
      </article>
    </template>
  </body>

</html>
