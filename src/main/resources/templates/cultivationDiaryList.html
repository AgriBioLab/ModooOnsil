<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모두의온실 | 재배일지작업</title>
    <link rel="stylesheet" href="vendor/krds/css/component/output.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cultivationDiary.css?v=20261120-badges" />
    <script src="js/sampleData.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/cultivationDiary.js?v=20261120-badges" defer></script>
  </head>
  <body data-page="list">
    <div class="app">
      <aside th:replace="~{sidebar :: sidebar}"></aside>
      <div class="workarea">
        <header th:replace="~{header :: header}"></header>
        <main>
          <nav class="crumb" aria-label="현재 위치">
            <span id="crumb">재배일지작업 / 목록</span>
          </nav>
          <div class="page-content" id="main" tabindex="-1">
            <th:block th:if="${listView}" th:insert="~{diary-list :: diaryList}"></th:block>
          </div>
        </main>
        <footer th:replace="~{footer :: footer}"></footer>
      </div>
    </div>
    <div class="notice-toast hidden" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
