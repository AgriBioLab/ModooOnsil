<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

  <head>
    <title>모두의온실 | 온실 환경변화</title>
    <th:block th:replace="~{fragments/common :: headBase}"></th:block>
    <link rel="stylesheet" href="/css/environment.css" />
    <script src="/js/environment.js" defer></script>
  </head>

  <body data-page="env-list">
    <div class="app">
      <!-- 사이드바 -->
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

      <div class="workarea">
        <!-- 상단 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- 본문 -->
        <main>
          <nav class="crumb" aria-label="현재 위치">
            <span id="crumb">온실 / 온실 환경변화 / 목록</span>
          </nav>

          <!-- TODO: EnvironmentController / Thymeleaf 연결 시 작기 선택 및 측정 이력 데이터를 Model로 바인딩 -->
          <div class="page-content" id="main" tabindex="-1">
            <div id="envListView">

              <div class="pagehead">
                <div>
                  <h1>온실 환경변화</h1>
                </div>
              </div>

              <!-- 최근 환경 요약 KPI (프로토타입 환경관측 카드 기준) -->
              <section class="panel env-latest-panel" aria-label="최근 측정 환경 요약">
                <div class="panel-head">
                  <p class="panel-title">최근 측정 환경</p>
                  <span class="counter" id="envLatestTime">측정 이력 대기</span>
                </div>

                <div class="env-kpi-groups">
                  <div class="env-kpi-grid cols-5">
                    <div class="env-kpi-card">
                      <div class="env-kpi-top"><span class="env-kpi-label">온도</span></div>
                      <div class="env-kpi-value is-empty" id="envKpiTemp">—<small>°C</small></div>
                    </div>
                    <div class="env-kpi-card">
                      <div class="env-kpi-top"><span class="env-kpi-label">상대습도</span></div>
                      <div class="env-kpi-value is-empty" id="envKpiHumidity">—<small>%RH</small></div>
                    </div>
                    <div class="env-kpi-card">
                      <div class="env-kpi-top"><span class="env-kpi-label">광도</span></div>
                      <div class="env-kpi-value is-empty" id="envKpiLight">—<small>µmol/m²/s</small></div>
                    </div>
                    <div class="env-kpi-card">
                      <div class="env-kpi-top"><span class="env-kpi-label">CO₂</span></div>
                      <div class="env-kpi-value is-empty" id="envKpiCo2">—<small>ppm</small></div>
                    </div>
                    <div class="env-kpi-card is-sub">
                      <div class="env-kpi-top"><span class="env-kpi-label">EC</span></div>
                      <div class="env-kpi-value is-empty" id="envKpiEc">—<small>dS/m</small></div>
                    </div>
                  </div>
                </div>
              </section>

              <section class="panel list-section" aria-label="온실 환경변화 목록">
                <!-- 검색 필터 -->
                <form class="list-filter-strip" id="envFilters">
                  <label class="list-ctrl-field" for="efHouse">
                    <span>온실</span>
                    <select class="ctrl" id="efHouse" name="greenhouseId">
                      <option value="">전체 온실</option>
                    </select>
                  </label>

                  <label class="list-ctrl-field" for="efCycle">
                    <span>작기계획</span>
                    <select class="ctrl" id="efCycle" name="planId">
                      <option value="">전체 작기계획</option>
                    </select>
                  </label>

                  <label class="list-ctrl-field" for="efMetric">
                    <span>측정 항목</span>
                    <select class="ctrl" id="efMetric" name="metric">
                      <option value="">전체 항목</option>
                      <option value="temperature">온도</option>
                      <option value="humidity">습도</option>
                      <option value="light">광도</option>
                      <option value="co2">CO₂</option>
                    </select>
                  </label>

                  <div class="list-ctrl-actions">
                    <button type="submit" class="btn main">검색</button>
                    <button type="button" class="btn" id="efReset">초기화</button>
                  </div>
                </form>

                <!-- 목록 요약 -->
                <div class="list-summary-bar">
                  <span class="list-total-count">총 <span class="list-count-value" id="envTotal">0</span>건</span>
                </div>

                <!-- 측정 이력 테이블 -->
                <div class="tablewrap">
                  <table class="data-table module-table">
                    <caption class="sr-only">온실 환경변화 측정 이력</caption>
                    <thead>
                      <tr>
                        <th scope="col">측정 일시</th>
                        <th scope="col">온실 · 작기</th>
                        <th scope="col">온도 (°C)</th>
                        <th scope="col">습도 (%RH)</th>
                        <th scope="col">광도 (µmol/m²/s)</th>
                        <th scope="col">CO₂ (ppm)</th>
                        <th scope="col">상태</th>
                      </tr>
                    </thead>
                    <tbody id="envRows">
                      <tr>
                        <td colspan="7" class="empty">등록된 환경 측정 이력이 없습니다. (서버 API 연동 대기)</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

            </div>
          </div>
        </main>

        <!-- 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
      </div>
    </div>

    <div th:replace="~{fragments/common :: toast}"></div>
  </body>

</html>
