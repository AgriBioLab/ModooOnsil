<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모두의온실 | 온실 환경변화</title>

    <link rel="stylesheet" href="/vendor/krds/css/component/output.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/environment.css" />

    <script src="/js/common.js" defer></script>
    <script src="/js/environment.js" defer></script>
  </head>

  <body data-page="env-list">
    <div class="app">
      <!-- 사이드바 -->
      <aside th:replace="~{sidebar :: sidebar}"></aside>

      <div class="workarea">
        <!-- 상단 헤더 -->
        <header th:replace="~{header :: header}"></header>

        <!-- 본문 -->
        <main>
          <nav class="crumb" aria-label="현재 위치">
            <span id="crumb">온실 / 온실 환경변화 / 목록</span>
          </nav>

          <!-- TODO: EnvironmentController / Thymeleaf 연결 시 작기 선택 및 측정 이력 데이터를 Model로 바인딩 -->
          <div class="page-content" id="main" tabindex="-1">
            <div id="envListView">

              <div class="pagehead">
                <div>
                  <h1>온실 환경변화</h1>
                </div>
              </div>

              <section class="panel list-section" aria-label="온실 환경변화 목록">
                <!-- 검색 필터 -->
                <form class="list-filter-strip" id="envFilters">
                  <label class="list-ctrl-field" for="efCycle">
                    <span>작기계획</span>
                    <select class="ctrl" id="efCycle" name="cycle">
                      <option value="all">전체 작기계획</option>
                    </select>
                  </label>

                  <div class="list-ctrl-actions">
                    <button type="submit" class="btn main">검색</button>
                    <button type="button" class="btn" id="efReset">초기화</button>
                  </div>
                </form>

                <!-- 목록 요약 -->
                <div class="list-summary-bar">
                  <span class="list-total-count">총 <strong>0</strong>건</span>
                </div>

                <!-- 측정 이력 영역 -->
                <div class="panel-body">
                  <p class="empty env-chart-empty">등록된 환경 측정 이력이 없습니다. (서버 API 연동 대기)</p>
                </div>
              </section>

            </div>
          </div>
        </main>

        <!-- 푸터 -->
        <footer th:replace="~{footer :: footer}"></footer>
      </div>
    </div>

    <div class="notice-toast hidden" id="toast" role="status" aria-live="polite"></div>
  </body>

</html>
