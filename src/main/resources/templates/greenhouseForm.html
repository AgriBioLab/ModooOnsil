<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

  <head>
    <title th:text="${greenhouseView == 'edit'} ? '모두의온실 | 온실 정보 수정' : '모두의온실 | 온실 정보 등록'">
      모두의온실 | 온실 정보 등록
    </title>
    <th:block th:replace="~{fragments/common :: headBase}"></th:block>
    <link rel="stylesheet" href="/css/greenhouse.css" />
    <script src="/js/greenhouseForm.js" defer></script>
  </head>

  <body th:attr="data-page=${greenhouseView == 'edit' ? 'gh-edit' : 'gh-create'},
                 data-greenhouse-view=${greenhouseView},
                 data-greenhouse-id=${greenhouseId}">
    <div class="app">
      <!-- 사이드바 -->
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

      <div class="workarea">
        <!-- 상단 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- 본문 -->
        <main>
          <nav class="crumb" aria-label="현재 위치">
            <span
              id="crumb"
              th:text="${greenhouseView == 'edit'} ? '온실 / 온실 정보 / 수정' : '온실 / 온실 정보 / 등록'">
              온실 / 온실 정보 / 등록
            </span>
          </nav>

          <div class="page-content" id="main" tabindex="-1">
            <!-- 상단 제목 -->
            <div class="pagehead">
              <div>
                <h1 th:text="${greenhouseView == 'edit'} ? '온실 정보 수정' : '온실 정보 등록'">
                  온실 정보 등록
                </h1>
              </div>
            </div>

            <!-- 온실 등록 · 수정 폼 -->
            <form class="module-form panel" id="ghForm" novalidate>
              <div class="panel-head">
                <p class="panel-title">온실 정보</p>
                <span class="counter">* 필수 입력</span>
              </div>

              <div class="module-form-scroll">
                <div class="module-input-grid">
                  <div class="field wide">
                    <label for="ghName">온실명 <span class="required">*</span></label>
                    <input
                      class="ctrl"
                      id="ghName"
                      maxlength="100"
                      placeholder="예: E온실"
                      required />
                  </div>

                  <div class="field">
                    <label for="ghType">유형</label>
                    <select class="ctrl" id="ghType">
                      <option value="">미선택</option>
                      <option value="단동" selected>단동</option>
                      <option value="연동">연동</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="ghCover">피복형태</label>
                    <select class="ctrl" id="ghCover">
                      <option value="">미선택</option>
                      <option value="유리">유리</option>
                      <option value="비닐" selected>비닐</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="ghCount">동 수</label>
                    <input class="ctrl" id="ghCount" type="number" min="1" value="1" />
                  </div>

                  <div class="field">
                    <label for="ghMedium">배지형태</label>
                    <select class="ctrl" id="ghMedium">
                      <option value="">미선택</option>
                      <option value="수태" selected>수태</option>
                      <option value="코코피트">코코피트</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="ghSide">측고 (m)</label>
                    <input class="ctrl" id="ghSide" type="number" step="0.01" min="0" />
                  </div>

                  <div class="field">
                    <label for="ghWidth">폭 (m)</label>
                    <input class="ctrl" id="ghWidth" type="number" step="0.01" min="0" />
                  </div>

                  <div class="field">
                    <label for="ghLength">길이 (m)</label>
                    <input class="ctrl" id="ghLength" type="number" step="0.01" min="0" />
                  </div>

                  <div class="field">
                    <label for="ghArea">등록 면적 (㎡)</label>
                    <input class="ctrl" id="ghArea" type="number" step="0.01" min="0" />
                  </div>

                  <div class="field wide">
                    <label for="ghImageUrl">온실 사진 URL</label>
                    <input
                      class="ctrl"
                      id="ghImageUrl"
                      type="text"
                      maxlength="500"
                      placeholder="이미지 URL을 입력하세요 (예: https://... 또는 /img/gh-a.jpg)" />
                    <div class="gh-photo-box gh-photo-preview hidden" id="ghPhotoPreview">
                      <img
                        class="gh-detail-photo"
                        id="ghPhotoPreviewImg"
                        src=""
                        alt="온실 사진 미리보기" />
                    </div>
                  </div>
                </div>

                <div class="errorbox hidden" id="ghErr" role="alert"></div>
              </div>

              <!-- 하단 액션 버튼 -->
              <div class="module-actions">
                <a
                  class="btn"
                  id="ghCancel"
                  th:href="${greenhouseView == 'edit'} ? @{/greenhouses/{id}(id=${greenhouseId})} : @{/greenhouses}">
                  취소
                </a>
                <button
                  type="submit"
                  class="btn main"
                  id="ghSubmitBtn"
                  th:text="${greenhouseView == 'edit'} ? '수정 저장' : '등록'">
                  등록
                </button>
              </div>
            </form>
          </div>
        </main>

        <!-- 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
      </div>
    </div>

    <div th:replace="~{fragments/common :: toast}"></div>
  </body>

</html>
