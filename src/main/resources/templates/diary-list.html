<div id="diaryList" th:fragment="diaryList" xmlns:th="http://www.thymeleaf.org">
  <!-- 상단 제목 -->
  <div class="pagehead">
    <div>
      <h1>재배일지작업 목록</h1>
    </div>
  </div>

  <section class="panel list-section" aria-label="재배일지작업 목록">
    <!-- 검색 필터 -->
    <form id="diaryFilters" class="list-filter-strip" method="get" th:action="@{/cultivation-diaries}">
      <label class="list-ctrl-field">
        <span>작기계획명</span>
        <select id="filterCycle" name="planName" class="ctrl">
          <option value="">전체 작기</option>
        </select>
      </label>

      <label class="list-ctrl-field">
        <span>온실명</span>
        <select id="filterGreenhouse" name="greenhouseName" class="ctrl">
          <option value="">전체 온실</option>
        </select>
      </label>

      <label class="list-ctrl-field">
        <span>품목명</span>
        <select id="filterCrop" name="cropName" class="ctrl">
          <option value="">전체 품목</option>
        </select>
      </label>

      <label class="list-ctrl-field">
        <span>품종명</span>
        <select id="filterVariety" name="varietyName" class="ctrl">
          <option value="">전체 품종</option>
        </select>
      </label>

      <label class="list-ctrl-field" for="workDateFilterTrigger">
        <span>실제 작업일</span>
        <span id="diaryDateControl"></span>
      </label>

      <div class="list-filter-actions">
        <button class="btn list-reset-btn" type="button" id="filterReset">초기화</button>
        <button class="btn main list-search-btn" type="submit">검색</button>
      </div>
    </form>

    <!-- 목록 요약 및 등록 버튼 -->
    <div class="list-summary-bar">
      <span class="list-total-count" aria-live="polite">
        총 <span class="list-count-value" id="diaryTotal">0</span>건
      </span>
      <div class="list-summary-actions">
        <a class="btn main xs" th:href="@{/cultivation-diaries/new}">+ 재배일지작업 등록</a>
      </div>
    </div>

    <!-- 목록 테이블 -->
    <div class="tablewrap">
      <table class="data-table diary-table">
        <caption class="sr-only">재배일지작업 목록</caption>
        <thead>
          <tr>
            <th class="row-index" scope="col">번호</th>
            <th scope="col">실제 작업일</th>
            <th scope="col">온실명</th>
            <th scope="col">품목명</th>
            <th scope="col">품종명</th>
            <th scope="col">작기계획명</th>
            <th scope="col">생육단계</th>
            <th class="tnum" scope="col">작업 건수 (전체/미완료)</th>
          </tr>
        </thead>
        <tbody id="diaryRows">
          <tr>
            <td class="empty" colspan="8">목록을 불러오는 중입니다.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
