<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>모두의온실 | 내정보</title>
    <th:block th:replace="~{fragments/common :: headBase}"></th:block>
    <link rel="stylesheet" href="/css/mypage.css" />
    <script
      src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"
      async></script>
    <script src="/js/mypage.js" defer></script>
  </head>
  <body data-page="profile">
    <div class="app profile-app">
      <!-- 사이드바 -->
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <div class="workarea">
        <!-- 상단 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>
        <!-- 본문 -->
        <main class="profile-page">
          <nav class="crumb" aria-label="현재 위치"><span id="crumb">내정보</span></nav>
          <div id="profileMemberData" hidden
               th:attr="data-username=${member.username},
                        data-display-name=${member.displayName},
                        data-farm-name=${member.farmName},
                        data-certification=${member.certification},
                        data-business-number=${member.businessNumber},
                        data-email=${member.email},
                        data-phone=${member.phone},
                        data-address=${member.address},
                        data-address-detail=${member.addressDetail},
                        data-main-crop=${member.mainCrop},
                        data-description=${member.description},
                        data-created-at=${member.createdAt?.toLocalDate()}"></div>
          <div class="page-content" id="main" tabindex="-1" inert>
            <!-- 상단 제목 -->
            <div class="pagehead">
              <div><h1 id="profileTitle">내정보</h1></div>
            </div>

            <!-- 농장 요약 카드 -->
            <section class="profile-summary-card" aria-label="농장 요약">
              <div class="profile-summary-title">
                <p class="profile-farm-title" id="profileFarmTitle" th:text="${#strings.defaultString(member.farmName, '—')}">—</p>
                <span class="krds-badge bg-light-gray" id="profileCertBadge">
                  <span class="sr-only">농업경영체 인증 상태</span>
                  <span id="profileCertLabel">미인증</span>
                </span>
              </div>
              <p id="profileFarmSummary" th:text="${#strings.defaultString(member.displayName, '—') + ' · ' + #strings.defaultString(member.mainCrop, '품목 미등록')}"></p>
            </section>

            <!-- 탭 메뉴 -->
            <div class="tabbar profile-tabbar" role="tablist" aria-label="내정보 메뉴">
              <button
                type="button"
                class="tabbtn"
                id="profile-tab-info"
                role="tab"
                data-profile-tab="info"
                aria-selected="true"
                aria-controls="profile-panel-info">
                농장정보
              </button>
              <button
                type="button"
                class="tabbtn"
                id="profile-tab-cert"
                role="tab"
                data-profile-tab="cert"
                aria-selected="false"
                aria-controls="profile-panel-cert">
                농업경영체 인증
              </button>
              <button
                type="button"
                class="tabbtn"
                id="profile-tab-pw"
                role="tab"
                data-profile-tab="pw"
                aria-selected="false"
                aria-controls="profile-panel-pw">
                농민 회원정보
              </button>
            </div>

            <!-- 탭 1: 농장정보 -->
            <div
              class="profile-tab-panel"
              id="profile-panel-info"
              role="tabpanel"
              aria-labelledby="profile-tab-info"
              tabindex="0">
              <section class="panel" id="profileDetails">
                <div class="panel-head">
                  <p class="panel-title">농장정보</p>
                  <button type="button" class="btn" id="profileEditBtn">수정</button>
                </div>
                <div class="panel-body">
                  <dl class="profile-facts">
                    <dt>농장명</dt>
                    <dd data-profile-value="farmName" th:text="${#strings.defaultString(member.farmName, '—')}">—</dd>
                    <dt>주요 재배 품목</dt>
                    <dd data-profile-value="mainCrop" th:text="${#strings.defaultString(member.mainCrop, '—')}">—</dd>
                    <dt>농장 주소</dt>
                    <dd data-profile-value="farmAddress" th:text="${#strings.defaultString(#strings.trim(#strings.defaultString(member.address, '') + ' ' + #strings.defaultString(member.addressDetail, '')), '—')}">—</dd>
                    <dt>농장 소개</dt>
                    <dd data-profile-value="description" th:text="${#strings.defaultString(member.description, '—')}">—</dd>
                  </dl>
                </div>
              </section>
              <section class="panel" id="profileEditor" hidden>
                <div class="panel-head"><p class="panel-title">농장정보 수정</p></div>
                <div class="panel-body">
                  <form id="profileForm" class="profile-form" novalidate>
                    <div class="module-input-grid profile-form-grid">
                      <div class="field">
                        <label for="profFarmName">
                          농장명
                          <span class="required" aria-hidden="true">*</span>
                        </label>
                        <input
                          id="profFarmName"
                          name="farmName"
                          class="ctrl"
                          type="text"
                          maxlength="100"
                          required
                          aria-describedby="profFarmName-error" />
                        <p class="profile-error" id="profFarmName-error" aria-live="polite"></p>
                      </div>
                      <div class="field">
                        <label for="profMainCrop">주요 재배 품목</label>
                        <input id="profMainCrop" name="mainCrop" class="ctrl" maxlength="100" />
                      </div>
                      <div class="field">
                        <label for="profAddress">농장 주소</label>
                        <div class="profile-address">
                          <input
                            id="profAddress"
                            name="address"
                            class="ctrl"
                            maxlength="255"
                            readonly />
                          <button type="button" class="btn" id="addrSearchBtn">주소 검색</button>
                        </div>
                      </div>
                      <div class="field">
                        <label for="profAddressDetail">상세 주소</label>
                        <input
                          id="profAddressDetail"
                          name="addressDetail"
                          class="ctrl"
                          maxlength="255" />
                      </div>
                      <div class="field profile-description">
                        <label for="profDesc">농장 소개</label>
                        <textarea id="profDesc" name="description" class="ctrl textarea"></textarea>
                      </div>
                    </div>
                    <div class="module-actions profile-form-actions">
                      <button type="button" class="btn" id="profileCancelBtn">취소</button>
                      <button type="submit" class="btn main">저장</button>
                    </div>
                  </form>
                </div>
              </section>
            </div>

            <!-- 탭 2: 농업경영체 인증 -->
            <div
              class="profile-tab-panel"
              id="profile-panel-cert"
              role="tabpanel"
              aria-labelledby="profile-tab-cert"
              tabindex="0"
              hidden>
              <section class="panel">
                <div class="panel-head">
                  <p class="panel-title" id="profileCertHeading" tabindex="-1">현재 인증 상태</p>
                </div>
                <div class="panel-body">
                  <dl class="profile-facts">
                    <dt>인증 상태</dt>
                    <dd data-profile-value="certification" th:text="${#strings.defaultString(member.certification == '인증중' ? '인증 대기중' : #strings.defaultString(member.certification, '미인증'), '—')}">—</dd>
                    <dt>농업경영체 등록번호</dt>
                    <dd data-profile-value="businessNumber" th:text="${#strings.defaultString(member.businessNumber, '—')}">—</dd>
                    <dt>인증일</dt>
                    <dd data-profile-value="certifiedAt">—</dd>
                  </dl>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><p class="panel-title">등록번호 인증</p></div>
                <div class="panel-body">
                  <p class="profile-hint" id="profileCertComplete" hidden>
                    농업경영체 인증이 완료된 회원입니다.
                  </p>
                  <p class="profile-hint" id="profileCertPending" hidden>
                    관리자가 등록번호를 확인하고 있습니다. 승인되면 인증 상태가 바뀝니다.
                  </p>
                  <form id="certRequestForm" class="profile-form profile-form-narrow" novalidate>
                    <div class="field">
                      <label for="certBusinessNumber">
                        농업경영체 등록번호
                        <span class="required" aria-hidden="true">*</span>
                      </label>
                      <input
                        id="certBusinessNumber"
                        name="businessNumber"
                        class="ctrl"
                        type="text"
                        maxlength="20"
                        required
                        aria-describedby="certBusinessNumber-hint certBusinessNumber-error" />
                      <p class="profile-hint" id="certBusinessNumber-hint">예시 AGRI-2026-0001</p>
                      <p class="profile-error" id="certBusinessNumber-error" aria-live="polite"></p>
                    </div>
                    <div class="module-actions profile-form-actions">
                      <button type="submit" class="btn main">인증 요청</button>
                    </div>
                  </form>
                </div>
              </section>
            </div>

            <!-- 탭 3: 농민 회원정보 · 비밀번호 변경 -->
            <div
              class="profile-tab-panel"
              id="profile-panel-pw"
              role="tabpanel"
              aria-labelledby="profile-tab-pw"
              tabindex="0"
              hidden>
              <section class="panel" id="memberDetails">
                <div class="panel-head">
                  <p class="panel-title">농민 회원정보</p>
                  <button type="button" class="btn" id="memberEditBtn">수정</button>
                </div>
                <div class="panel-body">
                  <dl class="profile-facts">
                    <dt>아이디</dt>
                    <dd data-profile-value="username" th:text="${#strings.defaultString(member.username, '—')}">—</dd>
                    <dt>대표자명</dt>
                    <dd data-profile-value="displayName" th:text="${#strings.defaultString(member.displayName, '—')}">—</dd>
                    <dt>이메일</dt>
                    <dd data-profile-value="email" th:text="${#strings.defaultString(member.email, '—')}">—</dd>
                    <dt>연락처</dt>
                    <dd data-profile-value="phone" th:text="${#strings.defaultString(member.phone, '—')}">—</dd>
                    <dt>회원가입일</dt>
                    <dd data-profile-value="createdAt" th:text="${#strings.defaultString(member.createdAt?.toLocalDate(), '—')}">—</dd>
                  </dl>
                </div>
              </section>
              <section class="panel" id="memberEditor" hidden>
                <div class="panel-head"><p class="panel-title">농민 회원정보 수정</p></div>
                <div class="panel-body">
                  <form id="memberForm" class="profile-form" novalidate>
                    <div class="module-input-grid profile-form-grid">
                      <div class="field">
                        <label for="profUsername">아이디</label>
                        <input
                          id="profUsername"
                          name="username"
                          class="ctrl"
                          type="text"
                          readonly />
                      </div>
                      <div class="field">
                        <label for="profDisplayName">
                          대표자명
                          <span class="required" aria-hidden="true">*</span>
                        </label>
                        <input
                          id="profDisplayName"
                          name="displayName"
                          class="ctrl"
                          type="text"
                          maxlength="50"
                          required
                          aria-describedby="profDisplayName-error" />
                        <p class="profile-error" id="profDisplayName-error" aria-live="polite"></p>
                      </div>
                      <div class="field">
                        <label for="profEmail">이메일</label>
                        <input
                          id="profEmail"
                          name="email"
                          class="ctrl"
                          type="email"
                          maxlength="255"
                          autocomplete="email"
                          aria-describedby="profEmail-error" />
                        <p class="profile-error" id="profEmail-error" aria-live="polite"></p>
                      </div>
                      <div class="field">
                        <label for="profPhone">연락처</label>
                        <input
                          id="profPhone"
                          name="phone"
                          class="ctrl"
                          type="tel"
                          maxlength="20"
                          autocomplete="tel"
                          aria-describedby="profPhone-error" />
                        <p class="profile-error" id="profPhone-error" aria-live="polite"></p>
                      </div>
                    </div>
                    <div class="module-actions profile-form-actions">
                      <button type="button" class="btn" id="memberCancelBtn">취소</button>
                      <button type="submit" class="btn main">저장</button>
                    </div>
                  </form>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><p class="panel-title">비밀번호 변경</p></div>
                <div class="panel-body">
                  <form id="passwordForm" class="profile-form profile-form-narrow" novalidate>
                    <div class="field">
                      <label for="curPw">
                        현재 비밀번호
                        <span class="required" aria-hidden="true">*</span>
                      </label>
                      <input
                        id="curPw"
                        name="currentPassword"
                        class="ctrl"
                        type="password"
                        autocomplete="current-password"
                        required
                        aria-describedby="curPw-error" />
                      <p class="profile-error" id="curPw-error" aria-live="polite"></p>
                    </div>
                    <div class="field">
                      <label for="newPw">
                        새 비밀번호
                        <span class="required" aria-hidden="true">*</span>
                      </label>
                      <input
                        id="newPw"
                        name="newPassword"
                        class="ctrl"
                        type="password"
                        minlength="8"
                        maxlength="20"
                        autocomplete="new-password"
                        required
                        aria-describedby="newPw-hint newPw-error" />
                      <p class="profile-hint" id="newPw-hint">8~20자로 입력하세요.</p>
                      <p class="profile-error" id="newPw-error" aria-live="polite"></p>
                    </div>
                    <div class="field">
                      <label for="chkPw">
                        새 비밀번호 확인
                        <span class="required" aria-hidden="true">*</span>
                      </label>
                      <input
                        id="chkPw"
                        name="confirmPassword"
                        class="ctrl"
                        type="password"
                        minlength="8"
                        maxlength="20"
                        autocomplete="new-password"
                        required
                        aria-describedby="chkPw-error" />
                      <p class="profile-error" id="chkPw-error" aria-live="polite"></p>
                    </div>
                    <div class="module-actions profile-form-actions">
                      <button type="submit" class="btn main">비밀번호 변경</button>
                    </div>
                  </form>
                </div>
              </section>
            </div>
          </div>
        </main>
        <!-- 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
      </div>
    </div>
    <div th:replace="~{fragments/common :: toast}"></div>
  </body>
</html>
