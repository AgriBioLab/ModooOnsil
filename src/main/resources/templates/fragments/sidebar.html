<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="appSidebar" aria-label="서비스 탐색">
  <div class="sidebar-head">
    <a class="brand" id="brand" href="/index.html" aria-label="모두의 온실 홈">
      <img class="brand-logo" src="/img/logo-horizontal-white.svg" alt="" />
    </a>
    <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="전체메뉴 닫기">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div class="sidebar-user-bar" id="sidebarUserBar" aria-label="로그인 계정 요약">
    <div class="sidebar-user-meta">
      <strong id="sidebarUserName"></strong>
      <span class="sidebar-cert-badge" id="sidebarUserCert"></span>
    </div>
    <div class="sidebar-user-farm" id="sidebarUserFarm"></div>
  </div>
  <nav class="nav" id="navigation" aria-label="주 메뉴">
    <a class="navbtn nav-home" href="/index.html" data-go="home">
      <svg
        class="nav-ico"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
      </svg>
      <span>홈</span>
    </a>
    <div class="navgroup" role="group" aria-label="재배일지작업">
      <div class="navhead nav-group-title">
        <svg
          class="nav-ico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
          <rect x="9" y="3" width="6" height="4" rx="1" />
          <path d="M9 12h6M9 16h4" />
        </svg>
        재배일지작업
      </div>
      <a class="navbtn nav-sub" href="/cultivation-diaries" data-go="list">재배일지작업목록</a>
      <a class="navbtn nav-sub" href="/cultivation-diaries/new" data-go="create">
        재배일지작업등록
      </a>
    </div>
    <div class="navgroup" role="group" aria-label="작기계획">
      <div class="navhead nav-group-title">
        <svg
          class="nav-ico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        작기계획
      </div>
      <a class="navbtn nav-sub" th:href="@{/cultivation-plans}" data-go="cycle-list">
        작기계획목록
      </a>
      <a
        class="navbtn nav-sub"
        th:href="@{/cultivation-plans/new}"
        data-go="cycle-create">
        작기계획등록
      </a>
    </div>
    <div class="navgroup" role="group" aria-label="온실">
      <div class="navhead nav-group-title">
        <svg
          class="nav-ico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true">
          <path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6" />
        </svg>
        온실
      </div>
      <a class="navbtn nav-sub" href="/environmentChangeList.html" data-go="env-list">
        온실 환경변화
      </a>
      <a class="navbtn nav-sub" href="/environmentIssueList.html" data-go="issue-list">
        온실 환경 이슈
      </a>
      <a class="navbtn nav-sub" href="/greenhouseList.html" data-go="gh-list">온실목록</a>
      <a class="navbtn nav-sub" href="/greenhouseList.html?view=gh-create" data-go="gh-create">
        온실등록
      </a>
    </div>
    <div class="navgroup" role="group" aria-label="내정보">
      <div class="navhead nav-group-title">
        <svg
          class="nav-ico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
        내정보
      </div>
      <a class="navbtn nav-sub" href="/mypage" data-go="profile">농장정보</a>
      <a class="navbtn nav-sub" href="/mypage?tab=cert" data-go="cert">농업경영체 인증</a>
      <a class="navbtn nav-sub" href="/mypage?tab=pw" data-go="member">농민 회원정보</a>
    </div>
  </nav>
  <div class="sidebar-foot" id="sidebarFoot"></div>
</aside>
</body>
</html>
