<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
  <div class="topbar-start">
    <button
      type="button"
      class="mobile-menu-btn"
      id="menuToggleBtn"
      aria-label="전체메뉴 열기"
      aria-controls="appSidebar"
      aria-expanded="false">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
      <span>메뉴</span>
    </button>
    <a class="topbar-brand" href="/index.html" aria-label="모두의 온실 홈">
      <img class="topbar-brand-logo" src="/img/logo-horizontal.svg" alt="" />
    </a>
    <div class="topbar-title"></div>
  </div>
  <div class="header-account" aria-label="로그인 사용자 정보">
    <span class="header-identity">
      <strong id="userName"></strong>
      <span id="userCertification"></span>
    </span>
    <a class="btn xs header-btn" href="/mypage" id="myInfoButton">내정보</a>
    <button class="btn xs header-btn" type="button" id="logoutButton">로그아웃</button>
  </div>
</header>
</body>
</html>
