242 L638.297,68.242 L648.297,68.242 L638.297,58.242" style="stroke:#A4ADB5;stroke-width:1;" fill="#FFF"/><text x="124" y="79.568" fill="#000" font-size="15" textLength="509.297" font-family="Malgun Gothic">업무 유스케이스 사전조건: 로그인 완료 및 본인 기록에 대한 접근권한 보유.</text><text x="124" y="99.519" fill="#000" font-size="15" textLength="462.979" font-family="Malgun Gothic">핵심·필수·선택은 프로젝트의 우선순위이며 UML 관계 종류가 아니다.</text><text x="124" y="119.47" fill="#000" font-size="15" textLength="423.75" font-family="Malgun Gothic">보상 신청 과정에는 기존 재배·출하 이력 확인을 항상 포함한다.</text><text x="124" y="139.421" fill="#000" font-size="15" textLength="356.484" font-family="Malgun Gothic">금액 산정·지급·외부 시스템 연동은 후속 검토 범위다.</text></g><!--entity UC01--><g class="entity" data-qualified-name="System.UC01" id="ent0003" data-source-line="18"><ellipse cx="382.853" cy="238.327" rx="124.853" ry="28.085" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="361.485" y="230.082" fill="#000" font-size="15" textLength="42.737" font-family="Malgun Gothic">UC-01</text><text x="285.939" y="250.033" fill="#000" font-size="15" textLength="193.828" font-family="Malgun Gothic">생산자·농장 정보를 관리한다</text></g><!--entity UC02--><g class="entity" data-qualified-name="System.UC02" id="ent0004" data-source-line="19"><ellipse cx="383.002" cy="322.36" rx="113.502" ry="28.117" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="361.634" y="314.167" fill="#000" font-size="15" textLength="42.737" font-family="Malgun Gothic">UC-02</text><text x="295.229" y="334.119" fill="#000" font-size="15" textLength="175.547" font-family="Malgun Gothic">화훼 재배현황을 관리한다</text></g><!--entity UC03--><g class="entity" data-qualified-name="System.UC03" id="ent0005" data-source-line="20"><ellipse cx="382.891" cy="407.02" rx="129.391" ry="28.278" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="361.523" y="398.557" fill="#000" font-size="15" textLength="42.737" font-family="Malgun Gothic">UC-03</text><text x="281.114" y="418.508" fill="#