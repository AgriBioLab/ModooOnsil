<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1034px;height:1043px;background:#FFFFFF;" width="1034px" height="1043px" viewBox="0 0 1034 1043" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="367.956" y="25.237" fill="#000" font-size="14" textLength="291.088" font-weight="700" font-family="Malgun Gothic">1차·2차 연결 · 서비스 개념 유스케이스 설계안</text></g><!--cluster System--><g class="cluster" data-qualified-name="System" id="ent0002" data-source-line="12"><rect x="209.5" y="171.621" width="808.5" height="714" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="413.594" y="191.035" fill="#000" font-size="16" textLength="400.313" font-weight="700" font-family="Malgun Gothic">동일 공공기관이 제공하는 생산자·피해보상 정보 서비스</text></g><!--cluster 2차 · 기록 관리·피해보상 신청--><g class="cluster" data-qualified-name="System.2. . .. ....... .." id="ent0003" data-source-line="13"><rect x="225.5" y="497.621" width="776.5" height="332" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="505.676" y="517.035" fill="#000" font-size="16" textLength="216.148" font-weight="700" font-family="Malgun Gothic">2차 · 기록 관리·피해보상 신청</text></g><!--cluster 1차 · 피해보상 결과조회--><g class="cluster" data-qualified-name="System.1. . .... ...." id="ent0009" data-source-line="20"><rect x="240" y="219.621" width="287" height="262" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="296.332" y="239.035" fill="#000" font-size="16" textLength="174.336" font-weight="700" font-family="Malgun Gothic">1차 · 피해보상 결과조회</text></g><!--entity Farmer--><g class="entity" data-qualified-name="Farmer" id="ent0001" data-source-line="11"><ellipse cx="40.813" cy="668.621" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M40.813,676.621 L40.813,703.621 M27.813,684.621 L53.813,684.621 M40.813,703.621 L27.813,718.621 M40.813,703.621 L53.813,718.621" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="6" y="737.535" fill="#000" font-size="16" textLength="69.625" font-family="Malgun Gothic">화훼 농민</text><text x="6" y="758.816" fill="#000" font-size="16" textLength="57.75" font-family="Malgun Gothic">(생산자)</text></g><!--entity Officer--><g class="entity" data-qualified-name="Officer" id="ent0013" data-source-line="26"><ellipse cx="874" cy="82.621" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M874,90.621 L874,117.621 M861,98.621 L887,98.621 M874,117.621 L861,132.621 M874,117.621 L887,132.621" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="834" y="151.535" fill="#000" font-size="16" textLength="80" font-family="Malgun Gothic">품질담당자</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="37"><path d="M113,39.621 L113,156.027 L654.133,156.027 L654.133,49.621 L644.133,39.621 L113,39.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M644.133,39.621 L644.133,49.621 L654.133,49.621 L644.133,39.621" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="119" y="62.035" fill="#000" font-size="16" textLength="423.188" font-family="Malgun Gothic">2차의 보상 신청에는 기존 이력 조회·확인이 항상 포함된다.</text><text x="119" y="83.316" fill="#000" font-size="16" textLength="339.125" font-family="Malgun Gothic">신청 시 선택한 기준정보·기록 버전을 보존한다.</text><text x="119" y="104.598" fill="#000" font-size="16" textLength="520.133" font-family="Malgun Gothic">include는 행동 포함 관계이며, 신청에서 지급까지의 진행 순서는 아니다.</text><text x="119" y="125.879" fill="#000" font-size="16" textLength="406.625" font-family="Malgun Gothic">보상금 산정·심사·지급을 이번 기능으로 가정하지 않는다.</text><text x="119" y="147.16" fill="#000" font-size="16" textLength="349.5" font-family="Malgun Gothic">로그인·로그아웃은 이 전체 개념도에서 생략했다.</text></g><!--entity U1--><g class="entity" data-qualified-name="System.2. . .. ....... ...U1" id="ent0004" data-source-line="14"><ellipse cx="383.262" cy="572.374" rx="119.262" ry="26.252" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="279.887" y="579.514" fill="#000" font-size="16" textLength="206.75" font-family="Malgun Gothic">생산자·농장 정보를 관리한다</text></g><!--entity U2--><g class="entity" data-qualified-name="System.2. . .. ....... ...U2" id="ent0005" data-source-line="15"><ellipse cx="383.43" cy="644.807" rx="126.43" ry="27.686" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="272.055" y="651.948" fill="#000" font-size="16" textLength="222.75" font-family="Malgun Gothic">화훼 재배·작업기록을 관리한다</text></g><!--entity U3--><g class="entity" data-qualified-name="System.2. . .. ....... ...U3" id="ent0006" data-source-line="16"><ellipse cx="383.301" cy="711.481" rx="94.801" ry="21.36" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="308.489" y="718.622" fill="#000" font-size="16" textLength="149.625" font-family="Malgun Gothic">출하이력을 관리한다</text></g><!--entity U4--><g class="entity" data-qualified-name="System.2. . .. ....... ...U4" id="ent0007" data-source-line="17"><ellipse cx="874.211" cy="787.463" rx="112.211" ry="24.842" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="778.836" y="794.604" fill="#000" font-size="16" textLength="190.75" font-family="Malgun Gothic">재배·출하 이력을 조회한다</text></g><!--entity U8--><g class="entity" data-qualified-name="System.2. . .. ....... ...U8" id="ent0008" data-source-line="18"><ellipse cx="383.521" cy="782.425" rx="142.021" ry="30.804" fill="#E8F2FC" style="stroke:#36566B;stroke-width:0.5;"/><text x="255.083" y="789.566" fill="#000" font-size="16" textLength="256.875" font-family="Malgun Gothic">기존 기록으로 피해보상을 신청한다</text></g><!--entity U5--><g class="entity" data-qualified-name="System.1. . .... .....U5" id="ent0010" data-source-line="21"><ellipse cx="383.39" cy="369.499" rx="127.39" ry="27.878" fill="#EFF1F3" style="stroke:#36566B;stroke-width:0.5;"/><text x="270.952" y="376.64" fill="#000" font-size="16" textLength="224.875" font-family="Malgun Gothic">피해보상 결과 목록을 조회한다</text></g><!--entity U6--><g class="entity" data-qualified-name="System.1. . .... .....U6" id="ent0011" data-source-line="22"><ellipse cx="383.686" cy="440.658" rx="110.686" ry="24.537" fill="#EFF1F3" style="stroke:#36566B;stroke-width:0.5;"/><text x="290.061" y="447.799" fill="#000" font-size="16" textLength="187.25" font-family="Malgun Gothic">피해보상 결과를 검색한다</text></g><!--entity U7--><g class="entity" data-qualified-name="System.1. . .... .....U7" id="ent0012" data-source-line="23"><ellipse cx="383.39" cy="295.499" rx="127.39" ry="27.878" fill="#EFF1F3" style="stroke:#36566B;stroke-width:0.5;"/><text x="270.952" y="302.64" fill="#000" font-size="16" textLength="224.875" font-family="Malgun Gothic">피해보상 결과 상세를 조회한다</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk14" data-link-type="association"><path d="M66.024,659.906 C77.535,640.755 93.189,620.769 113,608.621 C157.568,581.294 214.013,570.874 263.717,567.846" style="stroke:#526474;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk15" data-link-type="association"><path d="M76.019,695.101 C87.531,690.094 100.613,685.024 113,681.621 C159.109,668.954 210.902,660.519 256.67,654.95" style="stroke:#526474;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk16" data-link-type="association"><path d="M76.207,711.621 C125.367,711.621 217.833,711.621 288.358,711.621" style="stroke:#526474;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk17" data-link-type="association"><path d="M48.03,763.433 C55.741,803.701 73.262,857.034 113,883.621 C342.912,1037.446 700.936,877.93 827.112,812.704" style="stroke:#526474;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001"